<div class="chat-box">
  <h2>💬 Rozmowa</h2>
  <div class="messages">
    <p *ngFor="let message of messages">{{ message.text }}</p>
  </div>
  <input type="text" [(ngModel)]="newMessage" placeholder="Napisz wiadomość..." />
  <button pButton type="button" label="Wyślij" (click)="sendMessage()"></button>
</div>

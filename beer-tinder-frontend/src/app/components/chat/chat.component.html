<div class="chat-container">
  <div class="chat-header">💬 Czat</div>
  <div class="chat-header">
    💬 Czat z {{ receiverUsername || 'Użytkownik' }}
  </div>



  <div *ngFor="let message of messages" class="message-box" [class.self]="message.senderId === currentUserId">
    <p class="message-text">{{ message.content }}</p>
    <span class="timestamp">{{ message.timestamp | date:'shortTime' }}</span>
  </div>





  <div class="chat-input">
    <input type="text" [(ngModel)]="newMessage" placeholder="Napisz wiadomość..." />
    <button (click)="sendMessage()">📩</button>
  </div>
  <p-button pButton type="back-button" label="Back" icon="pi pi-home" (click)="goToHome()"></p-button>
</div>
